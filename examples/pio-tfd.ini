# Pio configuration — TFD
# Converted from config-TFD.json
#
# PIN NUMBERING — REQUIRES VERIFICATION
# ======================================
# The original config was NOT explicitly labelled WiringPi.
# The native GPIO pin numbers (4, 5, 23, 24, 25, 26, 27) are a strong match
# for BCM (standard libgpiod) numbering and have been translated as BCM here.
#
# The leftKeypad matrix rows [3,4,5,6] and cols [0,1,2] are AMBIGUOUS:
#   - Treated as BCM: rows BCM 3/4/5 are I2C/reserved, and BCM 4 conflicts
#     with fan, BCM 5 conflicts with pir.
#   - Treated as WiringPi: WiringPi 3→BCM22 is safe, but WiringPi 4→BCM23
#     conflicts with the "blue" pin, and WiringPi 5→BCM24 conflicts with
#     "green". WiringPi 0→BCM17, 1→BCM18, 2→BCM27 for cols would be fine.
#   - Treated as MCP23017 port A offsets 0–6: no BCM conflict, but the
#     current Pio keypad_matrix implementation requires native GPIO pins.
#
# The keypad section below is COMMENTED OUT.  Verify hardware wiring and
# uncomment once you know the actual BCM pin numbers for the matrix.
#
# Expander pins use bus_name:offset notation:
#   expander_a = MCP23017 at I2C address 0x20 (decimal 32)
#   expander_b = MCP23017 at I2C address 0x21 (decimal 33)
#   Old pin N in [32..47] → expander_a:(N-32)
#   Old pin N in [48..63] → expander_b:(N-48)

[global]
instance_name   = pio-tfd
poll_interval_ms = 15

[mqtt]
host            = localhost
port            = 1883
client_id       = pio-tfd
base_topic      = Paradox/TFD/GPIO
commands_topic  = Paradox/TFD/GPIO/commands
state_topic     = Paradox/TFD/GPIO/state
events_topic    = Paradox/TFD/GPIO/events
warnings_topic  = Paradox/TFD/GPIO/warnings
announce_topic  = Paradox/TFD/GPIO/announce
heartbeat_topic = Paradox/TFD/GPIO/heartbeat

# ── I2C buses ─────────────────────────────────────────────────────────────────

[bus:i2c_1]
type   = i2c
device = /dev/i2c-1

[bus:expander_a]
type      = mcp23017
parent    = bus:i2c_1
address   = 32
pin_count = 16

[bus:expander_b]
type      = mcp23017
parent    = bus:i2c_1
address   = 33
pin_count = 16

# ── Native GPIO — BCM numbering ───────────────────────────────────────────────

[gpio:fan]
type     = digital_out
pin      = 4
io_topic = fan
default  = 0

[gpio:pir]
type            = digital_in
pin             = 5
io_topic        = pir
debounce_cycles = 5

[gpio:maglock]
type     = digital_out
pin      = 26
io_topic = maglock
default  = 0

[gpio:blue]
type     = digital_out
pin      = 23
io_topic = blue
default  = 0

[gpio:green]
type     = digital_out
pin      = 24
io_topic = green
default  = 0

[gpio:red]
type     = digital_out
pin      = 27
io_topic = red
default  = 0

[gpio:door]
type            = digital_in
pin             = 25
io_topic        = door
debounce_cycles = 5

# ── Expander A (0x20) inputs — right panel ────────────────────────────────────

[gpio:right0]
type            = digital_in
pin             = expander_a:0
io_topic        = right0
debounce_cycles = 5

