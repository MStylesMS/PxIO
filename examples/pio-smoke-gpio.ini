# Smoke test config with GPIO endpoints — uses --mock-gpio so no hardware needed

[global]
instance_name   = pio-smoke-gpio
poll_interval_ms = 100

[mqtt]
host            = localhost
port            = 1883
client_id       = pio-smoke-gpio
base_topic      = pio/smoke
commands_topic  = pio/smoke/commands
state_topic     = pio/smoke/state
events_topic    = pio/smoke/events
warnings_topic  = pio/smoke/warnings
announce_topic  = pio/smoke/announce
heartbeat_topic = pio/smoke/heartbeat
heartbeat_interval_ms = 2000

[gpio:output1]
type     = digital_out
pin      = 17
io_topic = output1
default  = 0

[gpio:input1]
type            = digital_in
pin             = 27
io_topic        = input1
debounce_cycles = 4
