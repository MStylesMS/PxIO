# Smoke test config with GPIO endpoints — uses --mock-gpio so no hardware needed

[global]
instance_name   = pxio-smoke-gpio
poll_interval_ms = 100

[mqtt]
host            = localhost
port            = 1883
client_id       = pxio-smoke-gpio
base_topic      = pxio/smoke
commands_topic  = pxio/smoke/commands
state_topic     = pxio/smoke/state
events_topic    = pxio/smoke/events
warnings_topic  = pxio/smoke/warnings
announce_topic  = pxio/smoke/announce
heartbeat_topic = pxio/smoke/heartbeat
heartbeat_interval_ms = 2000

[gpio:output1]
type     = digital_out
pin      = 17
io_topic = output1
default  = 0

[gpio:input1]
type            = digital_in
pin             = 27
io_topic        = input1
debounce_cycles = 4
