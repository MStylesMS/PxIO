# PxIO configuration — Moscow (Jackson room)
# Converted from config-Moscow-Jackson-WiringPi.json
#
# Pin numbering notes:
#   Original used WiringPi numbering.  Native GPIO pins have been converted
#   to BCM (libgpiod) numbering as follows:
#     WiringPi 5  → BCM 24   (safe)
#     WiringPi 22 → BCM  6   (keypad row 0)
#     WiringPi 23 → BCM 13   (keypad row 1)
#     WiringPi 24 → BCM 19   (keypad row 2)
#     WiringPi 25 → BCM 26   (keypad row 3)
#     WiringPi  6 → BCM 25   (keypad col 0)
#     WiringPi 10 → BCM  8   (keypad col 1)
#     WiringPi 11 → BCM  7   (keypad col 2)
#
#   Expander pins use bus_name:offset notation:
#     expander_a = MCP23017 at I2C address 0x20 (decimal 32)
#     expander_b = MCP23017 at I2C address 0x21 (decimal 33)
#     Old pin N in [32..47] → expander_a:(N-32)
#     Old pin N in [48..63] → expander_b:(N-48)
#
# Note: the original config had two GPIOS entries both publishing to "magLock"
# (old PIN 41 = expander_a:9, and old PIN 63 = expander_b:15).  Both are
# preserved below — magLock and magLock_b — with the same io_topic.

[global]
instance_name = pxio-moscow-jax
poll_interval_ms = 10

[mqtt]
host           = localhost
port           = 1883
client_id      = pxio-moscow-jax
base_topic     = Paradox/Moscow/GPIO
commands_topic = Paradox/Moscow/GPIO/commands
state_topic    = Paradox/Moscow/GPIO/state
events_topic   = Paradox/Moscow/GPIO/events
warnings_topic = Paradox/Moscow/GPIO/warnings
announce_topic = Paradox/Moscow/GPIO/announce
heartbeat_topic = Paradox/Moscow/GPIO/heartbeat

# ── I2C buses ─────────────────────────────────────────────────────────────────

[bus:i2c_1]
type   = i2c
device = /dev/i2c-1

[bus:expander_a]
type      = mcp23017
parent    = bus:i2c_1
address   = 32
pin_count = 16

[bus:expander_b]
type      = mcp23017
parent    = bus:i2c_1
address   = 33
pin_count = 16

# ── Expander A (0x20) inputs ───────────────────────────────────────────────────

[gpio:F1]
type            = digital_in
pin             = expander_a:0
io_topic        = F1
debounce_cycles = 5

[gpio:F2]
type            = digital_in
pin             = expander_a:1
io_topic        = F2
debounce_cycles = 5

[gpio:F3]
type            = digital_in
pin             = expander_a:2
io_topic        = F3
debounce_cycles = 5

[gpio:F4]
type            = digital_in
pin             = expander_a:3
io_topic        = F4
debounce_cycles = 5

[gpio:F5]
type            = digital_in
pin             = expander_a:4
io_topic        = F5
debounce_cycles = 5

[gpio:F6]
type            = digital_in
pin             = expander_a:5
io_topic        = F6
debounce_cycles = 5

# ── Expander A (0x20) outputs ──────────────────────────────────────────────────

[gpio:transLight]
type    = digital_out
pin     = expander_a:6
io_topic = transLight
default = 0

[gpio:magLock]
type     = digital_out
pin      = expander_a:9
io_topic = magLock
default  = 0

[gpio:armedDisarmed]
type     = digital_out
pin      = expander_a:14
io_topic = armedDisarmed
default  = 0

[gpio:onOff]
type     = digital_out
pin      = expander_a:15
io_topic = onOff
default  = 0

# ── Expander B (0x21) inputs ───────────────────────────────────────────────────

[gpio:M1]
type            = digital_in
pin             = expander_b:0
io_topic        = M1
debounce_cycles = 5

[gpio:M2]
type            = digital_in
pin             = expander_b:1
io_topic        = M2
debounce_cycles = 5

[gpio:M3]
type            = digital_in
pin             = expander_b:2
io_topic        = M3
debounce_cycles = 5

[gpio:M4]
type            = digital_in
pin             = expander_b:3
io_topic        = M4
debounce_cycles = 5

[gpio:M5]
type            = digital_in
pin             = expander_b:4
io_topic        = M5
debounce_cycles = 5

[gpio:M6]
type            = digital_in
pin             = expander_b:5
io_topic        = M6
debounce_cycles = 5

[gpio:M7]
type            = digital_in
pin             = expander_b:6
io_topic        = M7
debounce_cycles = 5

[gpio:M8]
type            = digital_in
pin             = expander_b:7
io_topic        = M8
debounce_cycles = 5

[gpio:safe]
type            = digital_in
pin             = expander_b:14
io_topic        = safe
debounce_cycles = 5

# ── Expander B (0x21) outputs ──────────────────────────────────────────────────

[gpio:LW]
type     = digital_out
pin      = expander_b:8
io_topic = LW
default  = 0

[gpio:LU]
type     = digital_out
pin      = expander_b:9
io_topic = LU
default  = 0

[gpio:LR]
type     = digital_out
pin      = expander_b:10
io_topic = LR
default  = 0

[gpio:LG]
type     = digital_out
pin      = expander_b:11
io_topic = LG
default  = 0

[gpio:LB]
type     = digital_out
pin      = expander_b:12
io_topic = LB
default  = 0

[gpio:spareLight]
type     = digital_out
pin      = expander_b:13
io_topic = spareLight
default  = 0

# Second magLock entry from original config (old PIN 63 = expander_b:15).
# Both magLock and magLock_b publish to the same io_topic "magLock".
[gpio:magLock_b]
type     = digital_out
pin      = expander_b:15
io_topic = magLock
default  = 0

# ── Keypad matrix ─────────────────────────────────────────────────────────────
# WiringPi rows [22,23,24,25] → BCM [6,13,19,26]
# WiringPi cols [6,10,11]     → BCM [25,8,7]

[compound:keypad]
type            = keypad_matrix
io_topic        = Keypad
rows            = 6, 13, 19, 26
cols            = 25, 8, 7
keys            = 1, 2, 3, 4, 5, 6, 7, 8, 9, asterik, 0, pound
debounce_cycles = 5
